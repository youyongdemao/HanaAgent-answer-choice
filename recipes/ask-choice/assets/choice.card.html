<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask choice</title>
</head>
<body>
<script type="application/json" data-card-manifest>
{"spec":"1.0","display":{"preferredWidthPx":520},"stateSchema":{"type":"object","properties":{"uiLanguage":{"type":"string"},"title":{"type":"string"},"question":{"type":"string"},"options":{"type":"array","items":{"type":"string"}},"multi":{"type":"boolean"},"result":{"type":"object","properties":{"kind":{"type":"string"},"choice":{"type":"string"}}}}}}
</script>
<script type="application/json" data-card-state>
{"uiLanguage":"zh","title":"","question":"接下来用哪个方案推进？","options":["方案 A：先做骨架","方案 B：先接数据","方案 C：先搭界面"],"multi":false}
</script>
<style>
.ac-root{--ac-radius:calc(12px * var(--corner-radius-scale,1));font-family:var(--font-ui);color:var(--text);max-width:460px;margin:0 auto;padding:38px 2px 12px}
.ac-question{margin:0 0 12px;font-size:15px;font-weight:600;line-height:1.5;word-break:break-word}
.ac-options{display:flex;flex-direction:column;gap:6px}
.ac-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:var(--ac-radius);corner-shape:squircle;background:transparent;color:var(--text);font:inherit;font-size:12.5px;line-height:1.45;cursor:pointer;transition:background .16s ease,border-color .16s ease}
.ac-opt:hover{background:var(--overlay-subtle,color-mix(in srgb,var(--text) 6%,transparent))}
.ac-num{flex:none;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:calc(6px * var(--corner-radius-scale,1));corner-shape:squircle;background:var(--overlay-subtle,color-mix(in srgb,var(--text) 9%,transparent));font-size:10.5px;color:var(--text-muted)}
.ac-opt.is-on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ac-opt.is-on .ac-num{background:var(--accent);color:#fff}
.ac-custom{width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--border);border-radius:var(--ac-radius);corner-shape:squircle;background:transparent;color:var(--text);font:inherit;font-size:12.5px;line-height:1.45}
.ac-custom::placeholder{color:var(--text-muted)}
.ac-custom:focus{outline:none;border-color:var(--accent)}
.ac-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
.ac-hint{margin:0;font-size:11.5px;line-height:1.4;color:var(--text-muted)}
.ac-hint:empty{display:none}
.ac-actions{display:flex;gap:6px;flex:none;margin-left:auto}
.ac-btn{padding:6px 14px;border:1px solid var(--border);border-radius:calc(9px * var(--corner-radius-scale,1));corner-shape:squircle;background:transparent;color:var(--text);font:inherit;font-size:12.5px;line-height:1.5;cursor:pointer;transition:background .16s ease}
.ac-btn:hover{background:var(--overlay-subtle,color-mix(in srgb,var(--text) 7%,transparent))}
.ac-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.ac-primary:hover{background:var(--accent-hover)}
.ac-result{display:none;align-items:baseline;gap:9px;margin:0;font-size:13px;line-height:1.6}
.ac-tick{color:var(--green);font-size:13px}
.ac-root.is-done .ac-options,.ac-root.is-done .ac-custom,.ac-root.is-done .ac-foot{display:none}
.ac-root.is-done .ac-result{display:flex}
button:focus{outline:none}
</style>
<div class="ac-root" id="ac-root">
  <h2 class="ac-question" id="ac-question"></h2>
  <div class="ac-options" id="ac-options"></div>
  <input class="ac-custom" id="ac-custom" type="text">
  <div class="ac-foot">
    <p class="ac-hint" id="ac-hint"></p>
    <div class="ac-actions">
      <button type="button" class="ac-btn" id="ac-skip"></button>
      <button type="button" class="ac-btn ac-primary" id="ac-submit"></button>
    </div>
  </div>
  <p class="ac-result"><span class="ac-tick" id="ac-tick">✓</span><span id="ac-result-text"></span></p>
</div>
<script>
(function () {
  var TEXT = {
    "zh": { label: "需要你定一下", skip: "跳过", submit: "提交", custom: "或输入你的答案", picked: "已选 {count}", empty: "先选一个，或者自己写一个答案。", chosen: "已选择：{value}", skipped: "（跳过了这题）", multi: "可多选", noHost: "此卡片需要 Hana 才能把选择交回对话。", failed: "没能把这题交回对话。" },
    "zh-TW": { label: "需要你定一下", skip: "略過", submit: "送出", custom: "或輸入你的答案", picked: "已選 {count}", empty: "先選一個，或者自己寫一個答案。", chosen: "已選擇：{value}", skipped: "（略過了這題）", multi: "可多選", noHost: "此卡片需要 Hana 才能把選擇交回對話。", failed: "沒能把這題交回對話。" },
    "en": { label: "Needs your call", skip: "Skip", submit: "Submit", custom: "Or type an answer", picked: "{count} picked", empty: "Pick one, or write your own answer.", chosen: "Chosen: {value}", skipped: "(skipped)", multi: "Multiple picks allowed", noHost: "This card needs Hana to send your answer back.", failed: "Could not send the answer back." },
    "ja": { label: "確認したいこと", skip: "スキップ", submit: "送信", custom: "または回答を入力", picked: "{count} 件選択", empty: "1 つ選ぶか、回答を入力してください。", chosen: "選択：{value}", skipped: "（スキップしました）", multi: "複数選択可", noHost: "回答を会話に返すには Hana が必要です。", failed: "回答を送信できませんでした。" },
    "ko": { label: "확인이 필요합니다", skip: "건너뛰기", submit: "제출", custom: "또는 답을 입력", picked: "{count}개 선택", empty: "하나를 고르거나 답을 입력하세요.", chosen: "선택: {value}", skipped: "(건너뜀)", multi: "복수 선택 가능", noHost: "답을 대화로 보내려면 Hana가 필요합니다.", failed: "답을 보내지 못했습니다." }
  };
  var LEGACY = "en";
  var JOINT = { "zh": "、", "zh-TW": "、", "ja": "、", "en": ", ", "ko": ", " };

  var snapshot = null;
  var node = document.querySelector('script[type="application/json"][data-card-state]');
  if (node) { try { snapshot = JSON.parse(node.textContent || ""); } catch (_) {} }
  if (!snapshot || typeof snapshot !== "object") snapshot = {};

  function canonicalize(value) {
    if (typeof value !== "string") return null;
    var v = value.trim().replace(/_/g, "-").toLowerCase();
    if (v === "zh" || /^zh-(hans|cn|sg)(-|$)/.test(v)) return "zh";
    if (v === "zh-tw" || /^zh-(hant|hk)(-|$)/.test(v)) return "zh-TW";
    if (v === "en" || v.indexOf("en-") === 0) return "en";
    if (v === "ja" || v.indexOf("ja-") === 0) return "ja";
    if (v === "ko" || v.indexOf("ko-") === 0) return "ko";
    return null;
  }

  var supplied = Object.prototype.hasOwnProperty.call(snapshot, "uiLanguage");
  var language = canonicalize(snapshot.uiLanguage) || LEGACY;
  var strings = TEXT[language];
  var invalid = supplied && !canonicalize(snapshot.uiLanguage);
  if (supplied && !invalid) document.documentElement.lang = language;

  function t(key, values) {
    var text = Object.prototype.hasOwnProperty.call(strings, key) ? strings[key] : TEXT.en[key] || "";
    if (!values) return text;
    return text.replace(/\{([^}]+)\}/g, function (_, name) {
      return Object.prototype.hasOwnProperty.call(values, name) ? String(values[name]) : "";
    });
  }

  if (invalid) {
    var warn = document.createElement("p");
    warn.setAttribute("role", "alert");
    warn.style.cssText = "margin:16px;font-family:system-ui,sans-serif;color:var(--text,#2A2622)";
    warn.textContent = "This card has an unsupported UI language. Use zh, zh-TW, en, ja, or ko.";
    document.body.insertBefore(warn, document.body.firstChild);
    return;
  }

  var api = window.card;
  var root = document.getElementById("ac-root");
  var optionsBox = document.getElementById("ac-options");
  var hint = document.getElementById("ac-hint");
  var skipBtn = document.getElementById("ac-skip");
  var submitBtn = document.getElementById("ac-submit");

  var options = [];
  if (Object.prototype.toString.call(snapshot.options) === "[object Array]") {
    for (var i = 0; i < snapshot.options.length && options.length < 8; i += 1) {
      var item = snapshot.options[i];
      var label = typeof item === "string" ? item.trim() : "";
      if (label && options.indexOf(label) === -1) options.push(label);
    }
  }
  var multi = snapshot.multi === true;
  var allowCustom = snapshot.allowCustom !== false;
  var picked = [];
  var settled = false;

  var customEl = document.getElementById("ac-custom");
  if (customEl) {
    if (allowCustom) customEl.setAttribute("placeholder", t("custom"));
    else customEl.hidden = true;
  }

  document.getElementById("ac-question").textContent =
    typeof snapshot.question === "string" ? snapshot.question.trim() : "";
  skipBtn.textContent = t("skip");
  submitBtn.textContent = t("submit");
  hint.textContent = multi ? t("multi") : "";

  if (customEl && allowCustom) {
    customEl.addEventListener("input", function () {
      // 单选时「自己写」和「点选项」互斥
      if (customEl.value.trim() && !multi && picked.length) {
        picked = [];
        paint();
      }
      hint.textContent = multi ? (picked.length ? t("picked", { count: picked.length }) : t("multi")) : "";
    });
  }

  options.forEach(function (label, index) {
    var button = document.createElement("button");
    button.type = "button";
    button.className = "ac-opt";
    button.setAttribute("data-label", label);
    button.setAttribute("aria-pressed", "false");
    var num = document.createElement("span");
    num.className = "ac-num";
    num.setAttribute("aria-hidden", "true");
    num.textContent = String(index + 1);
    var text = document.createElement("span");
    text.textContent = label;
    button.appendChild(num);
    button.appendChild(text);
    button.addEventListener("click", function () {
      if (settled) return;
      if (multi) {
        var at = picked.indexOf(label);
        if (at === -1) picked.push(label); else picked.splice(at, 1);
        hint.textContent = picked.length ? t("picked", { count: picked.length }) : t("multi");
        paint();
        return;
      }
      // 单选：点一下就走，不用再按提交
      picked = [label];
      if (customEl) customEl.value = "";
      paint();
      send("answer", { choice: label }, "answer", label);
    });
    optionsBox.appendChild(button);
  });

  function paint() {
    [].slice.call(optionsBox.children).forEach(function (button) {
      var on = picked.indexOf(button.getAttribute("data-label")) !== -1;
      button.classList.toggle("is-on", on);
      button.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  function finish(kind, choice) {
    settled = true;
    root.classList.add("is-done");
    document.getElementById("ac-tick").textContent = kind === "skip" ? "" : "✓";
    document.getElementById("ac-result-text").textContent =
      kind === "skip" ? t("skipped") : t("chosen", { value: choice });
    if (api && api.state && typeof api.state.set === "function") {
      var pending = api.state.set("result", { kind: kind, choice: choice });
      if (pending && typeof pending.catch === "function") pending.catch(function () {});
    }
  }

  function send(name, payload, kind, choice) {
    if (!api || typeof api.capabilities !== "function" || typeof api.emit !== "function") {
      hint.textContent = t("noHost");
      return;
    }
    api.capabilities().then(function (envelope) {
      var result = envelope && envelope.ok === true ? envelope.result : null;
      var caps = result && result.capabilities ? result.capabilities : null;
      var word = caps && typeof caps.emit === "string" ? caps.emit : "";
      if (word !== "available" && word !== "local_fallback") {
        hint.textContent = t("noHost");
        return;
      }
      return api.emit(name, payload).then(function (reply) {
        if (reply && reply.ok === true) finish(kind, choice);
        else hint.textContent = t("failed");
      });
    }).catch(function () {
      hint.textContent = t("failed");
    });
  }

  function readChoice() {
    var typed = customEl && customEl.value ? customEl.value.trim() : "";
    if (typed) return typed;
    return picked.join(JOINT[language] || ", ");
  }

  submitBtn.addEventListener("click", function () {
    if (settled) return;
    var value = readChoice();
    if (!value) { hint.textContent = t("empty"); return; }
    send("answer", { choice: value }, "answer", value);
  });

  skipBtn.addEventListener("click", function () {
    if (settled) return;
    send("skip", {}, "skip", "");
  });

  if (api && api.state && typeof api.state.get === "function") {
    api.state.get().then(function (envelope) {
      var result = envelope && envelope.ok === true ? envelope.result : null;
      var saved = result && result.state ? result.state.result : null;
      if (saved && typeof saved === "object" && typeof saved.kind === "string") {
        finish(saved.kind, typeof saved.choice === "string" ? saved.choice : "");
      }
    }, function () {});
  }
})();
</script>
</body>
</html>
