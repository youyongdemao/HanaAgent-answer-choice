<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快捷回复 · 设置</title>
  <link rel="stylesheet" href="./assets/settings.css">
  <!-- 主题跟随与宿主握手都在这里：少了它宿主会一直等，页面转圈到超时 -->
  <script type="module" src="./assets/settings.js"></script>
</head>
<body data-hana-theme="inherit">
  <div class="st-page">

    <h1 class="st-title">界面设置</h1>

    <div class="st-forms">

      <label class="st-form" data-form="panel">
        <input class="st-radio" type="radio" name="form" value="panel">
        <span class="st-form-head">
          <b>弹窗</b>
        </span>
        <span class="st-demo" aria-hidden="true">
          <span class="dm dm-user">这次的提问用哪种样式？</span>
          <span class="dm dm-bot">选项挂在下方，点选即可。</span>
          <span class="d-popup">
            <span class="d-bar">
              <em class="d-dot"></em>
              <b class="d-name">提问样式</b>
              <em class="d-btn is-first">跳过</em>
              <em class="d-btn is-primary">确认</em>
              <em class="d-chev"></em>
            </span>
            <span class="d-q">提问用哪种形态？</span>
            <span class="d-opt"><em class="d-num">1</em>弹窗</span>
            <span class="d-opt"><em class="d-num">2</em>卡片</span>
          </span>
          <span class="d-input">说点什么…</span>
        </span>
      </label>

      <label class="st-form" data-form="card">
        <input class="st-radio" type="radio" name="form" value="card">
        <span class="st-form-head">
          <b>卡片</b>
        </span>
        <span class="st-demo is-flow" aria-hidden="true">
          <span class="dm dm-user">这次的提问改用卡片吧。</span>
          <span class="d-popup is-card">
            <span class="d-q">提问用哪种形态？</span>
            <span class="d-opt"><em class="d-num">1</em>弹窗</span>
            <span class="d-opt"><em class="d-num">2</em>卡片</span>
            <span class="d-opt"><em class="d-num">3</em>都可以</span>
          </span>
          <span class="dm dm-bot">好，卡片已经放在这里。</span>
          <span class="d-input">说点什么…</span>
        </span>
      </label>

    </div>

    <div class="st-actions">
      <span class="st-status" id="stStatus"></span>
      <button class="st-save" id="stSave" type="button">保存</button>
    </div>

    <h1 class="st-title">关于</h1>
    <div class="st-card">
      <!-- 自定义页面，版本号写在文件里；发版时记得同步 -->
      <div class="st-row">
        <span class="st-label">版本</span>
        <span class="st-value st-mono">v0.1.0</span>
      </div>
      <div class="st-row">
        <span class="st-label">GitHub</span>
        <span class="st-value st-mono">github.com/youyongdemao/HanaAgent-answer-choice</span>
      </div>
    </div>

  </div>
</body>
</html>
