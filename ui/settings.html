<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快捷回复 · 关于</title>
  <script>
    // 主题跟随：设置页与宿主同源，直接从宿主窗口抄它正在用的那套变量最可靠
    //（宿主塞进 URL 的只是创建时的初值，而且它只在主题变化时才推送）。
    // 抄不到（不在宿主里、跳域）才回退到 URL 里那份主题表。
    (() => {
      const VARS = [
        "--bg", "--bg-card", "--text", "--text-light", "--text-muted",
        "--accent", "--accent-hover", "--accent-rgb", "--border",
        "--font-ui", "--font-mono", "--corner-radius-scale", "--green", "--danger",
      ];
      let link = null;

      function fromHostWindow() {
        try {
          const hw = window.parent;
          if (!hw || hw === window) return false;
          const root = hw.document && hw.document.documentElement;
          if (!root) return false;
          const cs = hw.getComputedStyle(root);
          let painted = 0;
          for (const name of VARS) {
            const value = cs.getPropertyValue(name).trim();
            if (!value) continue;
            document.documentElement.style.setProperty(name, value);
            painted += 1;
          }
          const theme = String(root.dataset.theme || "").trim();
          if (theme) {
            document.documentElement.dataset.theme = theme;
            document.body.dataset.hanaTheme = theme;
          }
          return painted > 0;
        } catch (error) {
          return false;
        }
      }

      function fromUrl() {
        const advertised = new URLSearchParams(window.location.search).get("hana-css");
        if (!advertised) return;
        try {
          const stylesheetUrl = new URL(advertised, window.location.href);
          if (
            stylesheetUrl.origin !== window.location.origin ||
            (stylesheetUrl.protocol !== "http:" && stylesheetUrl.protocol !== "https:") ||
            stylesheetUrl.pathname !== "/api/apps/theme.css" ||
            !stylesheetUrl.searchParams.get("theme") ||
            stylesheetUrl.username ||
            stylesheetUrl.password ||
            stylesheetUrl.hash
          ) {
            return;
          }
          if (!link) {
            link = document.createElement("link");
            link.rel = "stylesheet";
            document.head.appendChild(link);
          }
          if (link.getAttribute("href") !== stylesheetUrl.href) link.setAttribute("href", stylesheetUrl.href);
        } catch (error) {
          console.warn("[ask-choice] 无法加载 Hana 主题样式", error);
        }
      }

      if (!fromHostWindow()) fromUrl();

      // 宿主换主题就重新抄一遍
      try {
        const hw = window.parent;
        if (hw && hw !== window && hw.document && hw.document.documentElement) {
          new MutationObserver(() => {
            if (!fromHostWindow()) fromUrl();
          }).observe(hw.document.documentElement, {
            attributes: true,
            attributeFilter: ["data-theme", "class", "style"],
          });
        }
      } catch (error) {
        /* 不在宿主里就没有可跟随的对象 */
      }
    })();
  </script>
  <link rel="stylesheet" href="./assets/settings.css">
</head>
<body data-hana-theme="inherit">
  <div class="st-page">

    <header class="st-head">
      <span class="st-mark" aria-hidden="true"></span>
      <div>
        <h1>快捷回复</h1>
        <p class="st-ver">v1.0.0 · HanaAgent 应用</p>
      </div>
    </header>

    <section class="st-block">
      <h2 class="st-title">它做什么</h2>
      <p class="st-text">Agent 需要你拿主意时，把几个选项挂到输入框上方。点一下，答案就作为一条消息回到对话，它接着往下做。单选点了就走；多选和自己写答案走确认。</p>
    </section>

    <section class="st-block">
      <h2 class="st-title">需要的权限</h2>
      <ul class="st-list">
        <li><b>在输入框上方显示自定义界面</b><span>把选择面板渲染出来</span></li>
        <li><b>在会话里发起对话回合</b><span>把你的选择作为一条消息投回对话</span></li>
        <li><b>读取会话信息</b><span>定位当前会话，面板才知道该挂在哪儿</span></li>
        <li><b>管理会话</b><span>目标会话不属于本应用自己时，才能投递过去</span></li>
        <li><b>读取会话输入</b><span>你发出下一条消息时，把还敞开的面板收起来</span></li>
      </ul>
    </section>

    <section class="st-block">
      <h2 class="st-title">仓库</h2>
      <p class="st-text st-mono">github.com/youyongdemao/ask-choice</p>
    </section>

  </div>
</body>
</html>
