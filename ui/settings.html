<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快捷回复 · 设置</title>
  <link rel="stylesheet" href="./assets/settings.css">
  <!-- 主题跟随与宿主握手都在这里：少了它宿主会一直等，页面转圈到超时 -->
  <script type="module" src="./assets/settings.js"></script>
</head>
<body data-hana-theme="inherit">
  <div class="st-page">

    <h1 class="st-title">提问形态</h1>
    <p class="st-hint">两种形态功能完全一样：都是「问你一个问题，你点一下就继续」。区别只在弹在哪里。选一个。</p>

    <div class="st-forms">

      <label class="st-form" data-form="panel">
        <input class="st-radio" type="radio" name="form" value="panel">
        <span class="st-form-head">
          <b>选择面板</b>
          <i>挂在输入框上方，不打断对话流</i>
        </span>
        <span class="st-demo" aria-hidden="true">
          <span class="dm dm-1"></span>
          <span class="dm dm-2"></span>
          <span class="d-panel">
            <span class="d-bar"><em class="d-dot"></em><em class="d-txt"></em><em class="d-chip"></em><em class="d-chip"></em><em class="d-chev"></em></span>
            <span class="d-rows"><em class="d-q"></em><em class="d-opt"></em><em class="d-opt"></em></span>
          </span>
          <span class="d-input"></span>
        </span>
      </label>

      <label class="st-form" data-form="card">
        <input class="st-radio" type="radio" name="form" value="card">
        <span class="st-form-head">
          <b>选择卡片</b>
          <i>作为一张卡片出现在对话里</i>
        </span>
        <span class="st-demo" aria-hidden="true">
          <span class="dm dm-1"></span>
          <span class="d-card">
            <span class="d-rows"><em class="d-q"></em><em class="d-opt"></em><em class="d-opt"></em><em class="d-opt"></em></span>
          </span>
          <span class="d-input"></span>
        </span>
      </label>

    </div>

    <div class="st-actions">
      <span class="st-status" id="stStatus"></span>
      <button class="st-save" id="stSave" type="button">保存</button>
    </div>

    <h1 class="st-title">关于</h1>
    <div class="st-card">
      <!-- 自定义页面，版本号写在文件里；发版时记得同步 -->
      <div class="st-row">
        <span class="st-label">版本</span>
        <span class="st-value st-mono">v0.1.0</span>
      </div>
      <div class="st-row">
        <span class="st-label">GitHub</span>
        <span class="st-value st-mono">github.com/youyongdemao/HanaAgent-answer-choice</span>
      </div>
    </div>

  </div>
</body>
</html>
